[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "apiprober"
version = "0.1.0"
description = "Passive API discovery and documentation CLI for undocumented REST services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.8"
authors = [
    {name = "Lukas Geiger", email = "lukisch@users.noreply.github.com"},
]
keywords = [
    "api",
    "api-discovery",
    "rest-api",
    "openapi",
    "documentation",
    "passive-reconnaissance",
    "sqlite",
    "zero-dependency",
    "hateoas",
    "schema-inference",
    "schema-extraction",
    "swagger",
    "developer-tools",
    "api-inventory",
    "endpoint-discovery",
    "local-first",
    "ethical-reconnaissance",
    "robots-txt",
    "rate-limiting",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/ApiProber"
Repository = "https://github.com/dev-bricks/ApiProber"
Issues = "https://github.com/dev-bricks/ApiProber/issues"
Changelog = "https://github.com/dev-bricks/ApiProber/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dev-bricks/ApiProber#readme"
"Parent Organization" = "https://github.com/dev-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
apiprober = "ApiProber.api_prober:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
include-package-data = false
package-dir = {"ApiProber" = "."}
packages = [
    "ApiProber",
    "ApiProber.core",
    "ApiProber.discovery",
    "ApiProber.export",
]

[tool.setuptools.package-data]
ApiProber = [
    "config.json",
    "*.ico",
    "wordlists/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["test_smoke.py", "test_security.py", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
